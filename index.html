<!DOCTYPE html>
<html>
<head>
  <title>This is a WIP</title>
  <link rel="stylesheet" type="text/css" href="styles/style.css">
  <meta charset="UTF-8">
</head>
<body>
    <main class="content">
        <!-- ASCII Art -->
        <pre class="ascii-art" id="ascii-art"></pre>

        <!-- welcome message -->
        <div id="welcome"></div>

        <!-- Terminal -->
        <div id="terminal-panel">
            <!-- Buttons for terminal -->
            <div class="buttons">
                <button>- help</button>
                <button>- about</button>
                <button>- projects</button>
                <button>- cv</button>
                <button id="quit-button" data-command="quit">- quit</button>
            </div>

            <div id="terminal">

                <div id="terminal-output"></div>
                <div class="terminal-input">
                    <span>user-421@ruj365.github.io:~$</span>
                    <input
                        type="text"
                        id="terminal-command"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>

            </div>
        </div>

    </main>

    <div id="quit-screen">
            <pre id="quit-art" class="quit-art"></pre>
            <p id="redirect-message"></p>
    </div>

    <!-- ORDER OF SCRIPTS IS IMPORTANT -->
     
    <!-- Use js to display the ASCII art -->
    <script src="scripts/script.js"></script>
    <!-- terminal script -->
    <script src="scripts/terminal.js"></script>
    <!-- redirect to github profile upon quit -->
    <script src="scripts/quit.js"></script>
</body>
</html>
